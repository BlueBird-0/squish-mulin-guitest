[project]
name = "squish-mcp"
version = "0.1.0"
description = "MCP server for running and inspecting a Squish for Qt GUI test suite"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.7",
]

[project.scripts]
squish-mcp = "squish_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["squish_mcp"]
